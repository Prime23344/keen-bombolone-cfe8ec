<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zuri — Profit Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #0F3D2E;
    --forest-dark: #0A2C21;
    --gold: #C9932F;
    --gold-light: #E4C077;
    --cream: #F8F4EA;
    --card: #FFFFFF;
    --ink: #1B2A24;
    --ink-soft: #5B6A63;
    --line: rgba(15,61,46,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,147,47,0.10), transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 40px;
  }

  /* ---- Roofline signature mark ---- */
  .mark{ width:64px; height:56px; margin:0 auto 14px; display:block; }
  .mark path, .mark rect, .mark circle{ stroke:var(--forest); }

  .eyebrow{
    text-align:center;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(30px,5vw,42px);
    color:var(--forest);
    text-align:center;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .tagline{
    text-align:center;
    font-style:italic;
    font-family:'Fraunces', serif;
    color:var(--gold);
    font-size:15px;
    margin:0 0 8px;
  }
  .rule-row{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin:14px auto 36px;
    max-width:360px;
  }
  .rule-row .line{ flex:1; height:1px; background:var(--line); }
  .rule-row .dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); }

  .tiers{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:34px;
    max-width:640px;
  }
  .tier-chip{
    border:1px solid var(--line);
    background:var(--card);
    padding:7px 14px;
    border-radius:100px;
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tier-chip b{ color:var(--forest); font-weight:600; }

  .card{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:34px 32px 32px;
    box-shadow: 0 1px 2px rgba(15,61,46,0.04), 0 18px 40px -22px rgba(15,61,46,0.25);
  }

  label{
    display:block;
    font-size:12.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:8px;
  }

  .input-wrap{
    display:flex;
    align-items:center;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:#FCFAF5;
    padding:0 4px 0 16px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap:focus-within{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(201,147,47,0.14);
  }
  .input-wrap span{
    font-size:14.5px;
    color:var(--ink-soft);
    font-weight:600;
    padding-right:8px;
    border-right:1px solid var(--line);
  }
  input[type=number]{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Inter',sans-serif;
    font-size:19px;
    font-weight:600;
    color:var(--forest);
    padding:15px 12px;
    width:100%;
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  input[type=number]::placeholder{ color:#B9C2BC; font-weight:500; }

  #hint{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
    text-align:center;
  }

  #result{ display:none; margin-top:26px; }

  .breakdown{
    background:#FBF8F1;
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:7px 0;
    font-size:14px;
  }
  .row .k{ color:var(--ink-soft); }
  .row .v{ font-weight:600; color:var(--ink); }
  .row.total{
    border-top:1px dashed var(--line);
    margin-top:6px;
    padding-top:12px;
  }
  .row.total .k{ color:var(--forest); font-weight:600; }
  .row.total .v{ color:var(--forest); font-size:16px; }
  #tier-chip-active{
    display:inline-block;
    background:var(--forest);
    color:#F8F4EA;
    font-size:11.5px;
    font-weight:600;
    padding:3px 10px;
    border-radius:100px;
  }

  .selling-price{
    margin-top:14px;
    background:linear-gradient(135deg, var(--forest), var(--forest-dark));
    border-radius:14px;
    padding:20px 22px;
    text-align:center;
  }
  .selling-price p{ margin:0; }
  .selling-price .label{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold-light);
    font-weight:600;
    margin-bottom:6px;
  }
  .selling-price .amount{
    font-family:'Fraunces', serif;
    font-size:32px;
    color:#fff;
    font-weight:500;
  }

  footer{
    margin-top:44px;
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    line-height:1.9;
  }
  footer b{ color:var(--forest); }
  footer .divider{
    width:32px; height:1px; background:var(--line);
    margin:10px auto;
  }

  @media (max-width:480px){
    .card{ padding:28px 22px; }
    .tiers{ gap:8px; }
  }
</style>
</head>
<body>

<svg class="mark" viewBox="0 0 64 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 26L32 4L60 26" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 22V50" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M52 22V50" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="43" cy="18" r="2.6" fill="var(--gold)" stroke="none"/>
</svg>

<p class="eyebrow">Zuri Home</p>
<h1>Profit calculator</h1>
<p class="tagline">Better living starts here.</p>

<div class="rule-row"><span class="line"></span><span class="dot"></span><span class="line"></span></div>

<div class="tiers" id="tiers"></div>

<div class="card">
  <label for="cost">Cost price</label>
  <div class="input-wrap">
    <span>KSh</span>
    <input type="number" id="cost" min="0" step="1" placeholder="e.g. 3,500" />
  </div>
  <p id="hint">Enter a cost price of KSh 100 or more to see your pricing.</p>

  <div id="result">
    <div class="breakdown">
      <div class="row">
        <span class="k">Margin tier</span>
        <span id="tier-chip-active">20%</span>
      </div>
      <div class="row">
        <span class="k">Margin profit</span>
        <span class="v" id="margin-profit"></span>
      </div>
      <div class="row">
        <span class="k">Flat addition</span>
        <span class="v">KSh 150</span>
      </div>
      <div class="row total">
        <span class="k">Total profit</span>
        <span class="v" id="total-profit"></span>
      </div>
    </div>
    <div class="selling-price">
      <p class="label">Selling price</p>
      <p class="amount" id="selling-price"></p>
    </div>
  </div>
</div>

<footer>
  <b>ZURI</b> &mdash; Everything your home needs, in one place.
  <div class="divider"></div>
  +254 758 366 801 &nbsp;·&nbsp; shoppingatzuri@gmail.com
</footer>

<script>
// ---- Margin tiers config ----
// Edit percentages and price ranges here. Add, remove, or change rows freely.
// `max: null` means "no upper limit" for that tier.
const TIERS = [
  { min: 100,   max: 9999,  rate: 0.20 },
  { min: 10000, max: 19999, rate: 0.10 },
  { min: 20000, max: null,  rate: 0.05 },
];
const FLAT_ADDITION = 150;
const MIN_COST = TIERS[0].min;

function fmt(n){
  return 'KSh ' + Math.round(n).toLocaleString('en-KE');
}
function fmtRange(n){
  return n.toLocaleString('en-KE');
}
function pctLabel(rate){
  return (rate * 100).toString().replace(/\.0$/, '') + '%';
}

function renderTiers(){
  const tiersBox = document.getElementById('tiers');
  tiersBox.innerHTML = TIERS.map(t => {
    const range = t.max == null
      ? `KSh ${fmtRange(t.min)}+`
      : `KSh ${fmtRange(t.min)}&ndash;${fmtRange(t.max)}`;
    return `<div class="tier-chip"><b>${pctLabel(t.rate)}</b>&nbsp;${range}</div>`;
  }).join('');
}

const input = document.getElementById('cost');
const resultBox = document.getElementById('result');
const hint = document.getElementById('hint');

function findTier(val){
  return TIERS.find((t, i) => {
    const nextMin = TIERS[i + 1] ? TIERS[i + 1].min : null;
    return val >= t.min && (nextMin == null || val < nextMin);
  });
}

function calc(){
  const val = parseFloat(input.value);

  if (isNaN(val) || val <= 0) {
    resultBox.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = `Enter a cost price of KSh ${fmtRange(MIN_COST)} or more to see your pricing.`;
    return;
  }

  const tier = findTier(val);
  if (!tier) {
    resultBox.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = `That price is below KSh ${fmtRange(MIN_COST)} — outside the pricing tiers.`;
    return;
  }

  const marginProfit = val * tier.rate;
  const totalProfit = marginProfit + FLAT_ADDITION;
  const sellingPrice = val + totalProfit;

  document.getElementById('tier-chip-active').textContent = pctLabel(tier.rate);
  document.getElementById('margin-profit').textContent = fmt(marginProfit);
  document.getElementById('total-profit').textContent = fmt(totalProfit);
  document.getElementById('selling-price').textContent = fmt(sellingPrice);

  resultBox.style.display = 'block';
  hint.style.display = 'none';
}

renderTiers();
input.addEventListener('input', calc);
</script>

</body>
</html>
